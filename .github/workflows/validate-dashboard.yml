name: Validate Dashboard

concurrency:
  group: validate-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '**/*.ps1'
      - 'azure/**'
      - 'build/manifests/**'
      - 'build/PSScriptAnalyzerSettings.psd1'
      - 'build/Validate-DashboardReports.ps1'
      - 'src/**'
      - 'templates/**'
      - 'tests/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
      - '.github/workflows/sync-azure-runbook.yml'
      - '.github/workflows/sync-azure-package.yml'
      - '.github/workflows/release-azure-package.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.ps1'
      - 'azure/**'
      - 'build/manifests/**'
      - 'build/PSScriptAnalyzerSettings.psd1'
      - 'build/Validate-DashboardReports.ps1'
      - 'src/**'
      - 'templates/**'
      - 'tests/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
      - '.github/workflows/sync-azure-runbook.yml'
      - '.github/workflows/sync-azure-package.yml'
      - '.github/workflows/release-azure-package.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install validation modules
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -AllowClobber -Scope CurrentUser
          Install-Module -Name Az.Accounts -Force -AllowClobber -Scope CurrentUser

      - name: Run deterministic preflight
        shell: pwsh
        run: |
          .\build\Invoke-RegressionValidation.ps1

      - name: Smoke test Azure package
        shell: pwsh
        run: |
          $packagePath = Join-Path $PWD '.local\local-reports\validate-dashboard\Azure-validation.zip'
          $extractPath = Join-Path $PWD '.local\local-reports\validate-dashboard\Azure-validation'
          .\build\Build-AzureReleasePackage.ps1 -OutputPath $packagePath
          Expand-Archive -LiteralPath $packagePath -DestinationPath $extractPath -Force

          if (Test-Path -LiteralPath (Join-Path $extractPath 'build')) {
            throw 'Azure release package unexpectedly contains a build directory.'
          }

          & (Join-Path $extractPath 'azure\Upload-Templates.ps1') -StorageAccountName 'validationstorageaccount' -WhatIf

name: Validate Dashboard

on:
  pull_request:
    paths:
      - 'Generate-VulnerabilityDashboard.ps1'
      - 'Validate-DashboardReports.ps1'
      - 'templates/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
  push:
    branches:
      - main
      - 'test/**'
    paths:
      - 'Generate-VulnerabilityDashboard.ps1'
      - 'Validate-DashboardReports.ps1'
      - 'templates/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate dashboard from committed exports
        shell: pwsh
        run: |
          Write-Host "Regenerating dashboard from repository exports..."
          .\Generate-VulnerabilityDashboard.ps1

      - name: Validate dashboard integrity
        shell: pwsh
        run: |
          Write-Host "Running dashboard integrity audit..."
          .\Validate-DashboardReports.ps1 -OutputPath .\validate-output.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-validation-report
          path: validate-output.json
          if-no-files-found: error
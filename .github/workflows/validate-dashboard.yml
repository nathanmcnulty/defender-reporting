name: Validate Dashboard

concurrency:
  group: validate-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '*.ps1'
      - '**/*.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - 'Validate-DashboardReports.ps1'
      - 'templates/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
  push:
    branches:
      - main
    paths:
      - '*.ps1'
      - '**/*.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - 'Validate-DashboardReports.ps1'
      - 'templates/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -AllowClobber -Scope CurrentUser

      - name: Run deterministic preflight
        shell: pwsh
        run: |
          .\Invoke-RegressionValidation.ps1

name: Validate Dashboard

on:
  pull_request:
    paths:
      - 'Generate-VulnerabilityDashboard.ps1'
      - 'Validate-DashboardReports.ps1'
      - 'templates/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
  push:
    branches:
      - main
      - 'test/**'
    paths:
      - 'Generate-VulnerabilityDashboard.ps1'
      - 'Validate-DashboardReports.ps1'
      - 'templates/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate dashboard from committed exports
        shell: pwsh
        run: |
          Write-Host "Regenerating dashboard from repository exports and validating it..."
          .\Generate-VulnerabilityDashboard.ps1 -Validate -IncludeLegacyFixtureRegression
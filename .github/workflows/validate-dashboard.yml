name: Validate Dashboard

on:
  pull_request:
    paths:
      - '*.ps1'
      - '**/*.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - 'Validate-DashboardReports.ps1'
      - 'templates/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
  push:
    branches:
      - main
      - 'test/**'
    paths:
      - '*.ps1'
      - '**/*.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - 'Validate-DashboardReports.ps1'
      - 'templates/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -AllowClobber -Scope CurrentUser
          $settingsPath = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          $scriptPaths = Get-ChildItem -Path $PWD -Recurse -Filter *.ps1 -File | Select-Object -ExpandProperty FullName
          $results = foreach ($scriptPath in $scriptPaths) {
            Invoke-ScriptAnalyzer -Path $scriptPath -Settings $settingsPath
          }
          if ($results) {
            $results |
              Sort-Object Path, Line, RuleName |
              Format-Table Path, RuleName, Severity, Line, Message -Wrap -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) issue(s) across repo PowerShell scripts."
          }

      - name: Rebuild generated runbook
        shell: pwsh
        run: |
          Write-Host "Rebuilding the generated Azure Automation runbook..."
          .\azure\Build-Runbook.ps1
          git diff --quiet -- azure/Invoke-DashboardPipeline.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "azure/Invoke-DashboardPipeline.ps1 is out of date. Run .\azure\Build-Runbook.ps1 and commit the result."
            git diff -- azure/Invoke-DashboardPipeline.ps1
            exit 1
          }

      - name: Regenerate dashboard from committed exports
        shell: pwsh
        run: |
          Write-Host "Regenerating dashboard from repository exports and validating it..."
          .\Generate-VulnerabilityDashboard.ps1 -Validate -IncludeLegacyFixtureRegression

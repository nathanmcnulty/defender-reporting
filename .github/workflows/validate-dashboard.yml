name: Validate Dashboard

on:
  pull_request:
    paths:
      - 'Generate-VulnerabilityDashboard.ps1'
      - 'Invoke-VulnerabilityExport.ps1'
      - 'shared-helpers.ps1'
      - 'VulnExportStore.ps1'
      - 'azure/Build-Runbook.ps1'
      - 'azure/runbook-source.ps1'
      - 'azure/Invoke-DashboardPipeline.ps1'
      - 'Validate-DashboardReports.ps1'
      - 'templates/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
  push:
    branches:
      - main
      - 'test/**'
    paths:
      - 'Generate-VulnerabilityDashboard.ps1'
      - 'Invoke-VulnerabilityExport.ps1'
      - 'shared-helpers.ps1'
      - 'VulnExportStore.ps1'
      - 'azure/Build-Runbook.ps1'
      - 'azure/runbook-source.ps1'
      - 'azure/Invoke-DashboardPipeline.ps1'
      - 'Validate-DashboardReports.ps1'
      - 'templates/**'
      - 'exports/**'
      - 'VulnerabilityDashboard.html'
      - '.github/workflows/validate-dashboard.yml'
      - '.github/workflows/update-vulnerability-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild generated runbook
        shell: pwsh
        run: |
          Write-Host "Rebuilding the generated Azure Automation runbook..."
          .\azure\Build-Runbook.ps1
          if (-not (git diff --quiet -- azure/Invoke-DashboardPipeline.ps1)) {
            Write-Error "azure/Invoke-DashboardPipeline.ps1 is out of date. Run .\azure\Build-Runbook.ps1 and commit the result."
            git diff -- azure/Invoke-DashboardPipeline.ps1
            exit 1
          }

      - name: Regenerate dashboard from committed exports
        shell: pwsh
        run: |
          Write-Host "Regenerating dashboard from repository exports and validating it..."
          .\Generate-VulnerabilityDashboard.ps1 -Validate -IncludeLegacyFixtureRegression
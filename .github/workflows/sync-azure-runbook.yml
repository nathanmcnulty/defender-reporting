name: Sync Azure Artifacts

concurrency:
  group: sync-azure-artifacts-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'build/Build-SharedHelpers.ps1'
      - 'build/manifests/shared-helpers.json'
      - 'build/private/ArtifactManifestTools.ps1'
      - 'build/private/AzureArtifactBuildTools.ps1'
      - 'build/private/DashboardTemplatePublishTools.ps1'
      - 'build/Publish-DashboardTemplates.ps1'
      - 'src/powershell/Shared/**'
      - 'build/azure/Build-Runbook.ps1'
      - 'build/azure/Build-TemplatePublisher.ps1'
      - 'build/azure/runbook-source.ps1'
      - '.github/workflows/sync-azure-runbook.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-runbook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Build Azure deployment artifacts
        shell: pwsh
        run: |
          .\build\azure\Build-Runbook.ps1
          .\build\azure\Build-TemplatePublisher.ps1

      - name: Commit regenerated Azure artifacts
        shell: pwsh
        env:
          SYNC_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add azure/Invoke-DashboardPipeline.ps1 azure/Upload-Templates.ps1

          git diff --staged --quiet -- azure/Invoke-DashboardPipeline.ps1 azure/Upload-Templates.ps1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Azure deployment artifacts are already up to date"
            exit 0
          }

          if ($LASTEXITCODE -ne 1) {
            throw "git diff --staged --quiet failed with exit code $LASTEXITCODE"
          }

          if ([string]::IsNullOrWhiteSpace($env:SYNC_BRANCH)) {
            throw "SYNC_BRANCH is not set."
          }

          $message = "chore: regenerate Azure deployment artifacts"
          git commit -m $message
          git push origin HEAD:$env:SYNC_BRANCH
          Write-Host "Committed and pushed regenerated Azure deployment artifacts"

name: Export Dashboard PDFs

on:
  workflow_dispatch:
  # Uncomment to run automatically (example: every Monday at 6 AM UTC after the daily dashboard update):
  # schedule:
  #   - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Check whether PDF export is needed
        id: freshness
        uses: actions/github-script@v8
        with:
          script: |
            const htmlPath = 'VulnerabilityDashboard.html';
            const reportsPath = 'reports';
            const branchName = context.ref.replace('refs/heads/', '');

            const htmlCommitResponse = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: htmlPath,
              per_page: 1,
              sha: context.sha,
            });

            if (!htmlCommitResponse.data.length) {
              throw new Error(`No commit history found for ${htmlPath}.`);
            }

            const htmlUpdatedAt =
              htmlCommitResponse.data[0].commit.committer?.date ??
              htmlCommitResponse.data[0].commit.author?.date;

            let hasCommittedPdfReports = false;

            try {
              const reportsContentResponse = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: reportsPath,
                ref: branchName,
              });

              const reportsEntries = Array.isArray(reportsContentResponse.data)
                ? reportsContentResponse.data
                : [reportsContentResponse.data];

              hasCommittedPdfReports = reportsEntries.some(entry =>
                entry.type === 'file' && entry.name.endsWith('.pdf')
              );
            }
            catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            let shouldExport = true;
            let reason = `Exporting PDFs because no previous committed PDFs were found under ${reportsPath}/.`;

            if (hasCommittedPdfReports) {
              const reportsCommitResponse = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: reportsPath,
                per_page: 1,
                sha: context.sha,
              });

              if (!reportsCommitResponse.data.length) {
                throw new Error(`Committed PDFs were found under ${reportsPath}/, but no commit history was returned for that path.`);
              }

              const latestReportsCommit = reportsCommitResponse.data.find(commit => {
                return commit.sha !== htmlCommitResponse.data[0].sha;
              }) ?? reportsCommitResponse.data[0];

              const reportsUpdatedAt =
                latestReportsCommit.commit.committer?.date ??
                latestReportsCommit.commit.author?.date;

              if (Date.parse(htmlUpdatedAt) > Date.parse(reportsUpdatedAt)) {
                reason = `Exporting PDFs because ${htmlPath} changed at ${htmlUpdatedAt}, which is newer than the latest committed PDF update from ${reportsUpdatedAt}.`;
              }
              else {
                shouldExport = false;
                reason = `Skipping PDF export because ${htmlPath} changed at ${htmlUpdatedAt}, which is not newer than the latest committed PDF update from ${reportsUpdatedAt}.`;
              }
            }

            core.info(reason);
            core.setOutput('should_export', shouldExport ? 'true' : 'false');
            core.setOutput('reason', reason);

      - name: Report export decision
        run: echo "${{ steps.freshness.outputs.reason }}"

      - name: Setup Node.js
        if: steps.freshness.outputs.should_export == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Ensure reports directory exists
        if: steps.freshness.outputs.should_export == 'true'
        run: mkdir -p reports

      - name: Install Playwright
        if: steps.freshness.outputs.should_export == 'true'
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps

      - name: Export reports to PDF
        if: steps.freshness.outputs.should_export == 'true'
        run: node .github/scripts/export-pdf-reports.js

      - name: Commit PDF reports
        if: steps.freshness.outputs.should_export == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports

          if git diff --staged --quiet; then
            echo "No PDF report changes to commit"
          else
            git commit -m "Update PDF reports"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      - name: Upload PDF reports
        if: steps.freshness.outputs.should_export == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-reports-${{ github.run_number }}
          path: reports/*.pdf
          retention-days: 30
